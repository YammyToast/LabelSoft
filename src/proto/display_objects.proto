syntax="proto3";

package template;

message Position {
    float x = 1;
    float y = 2;
}

message Text {
    Position position = 1;
    float max_width = 2;
    float max_height = 3;
    string data_column = 4;
    uint32 font_size = 5;
    string font = 6;
}   

message Image {
    Position position = 1;
    float width = 2;
    float height = 3;
    string image_path = 4;
}